# nginx configuration for the SAIC50 web version (Shinylive / webR).
# webR compiles R to WebAssembly in the browser, which requires
# 'unsafe-eval' in script-src. Without it the app never finishes loading.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: https:; worker-src 'self' blob:; font-src 'self' data: https:; connect-src 'self' blob: data: https:; media-src 'self' blob: https:; object-src 'none'; frame-src 'self' blob: https:;" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json application/wasm;

    location / {
        try_files $uri $uri/ =404;
    }
}
